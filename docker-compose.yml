version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: autoresearch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoresearch
      POSTGRES_PASSWORD: autoresearch_secret
      POSTGRES_DB: autoresearch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoresearch"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: autoresearch-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: autoresearch
      DATABASE_PASSWORD: autoresearch_secret
      DATABASE_NAME: autoresearch
      WORKER_URL: http://worker:8000
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: autoresearch-worker
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - worker_data:/app/data
      - ./apps/worker/src/config:/app/src/config
    # Uncomment below for GPU support (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: autoresearch-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  worker_data:

networks:
  default:
    name: autoresearch-network
